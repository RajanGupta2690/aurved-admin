<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle (Optional) -->
  <!-- <circle cx="60" cy="60" r="60" fill="#f5f5f4"/> -->
  
  <!-- Infinity Symbol - Orange Part -->
  <path d="M30 60 C30 45, 40 35, 50 35 C60 35, 65 42, 70 50 C75 58, 80 65, 90 65 C100 65, 110 55, 110 45 C110 35, 100 25, 90 25 C80 25, 75 32, 70 40 C65 48, 60 55, 50 55 C40 55, 30 45, 30 35" 
        fill="url(#orangeGradient)" 
        opacity="0.9"/>
  
  <!-- Infinity Symbol - Black Part -->
  <path d="M90 60 C90 75, 80 85, 70 85 C60 85, 55 78, 50 70 C45 62, 40 55, 30 55 C20 55, 10 65, 10 75 C10 85, 20 95, 30 95 C40 95, 45 88, 50 80 C55 72, 60 65, 70 65 C80 65, 90 75, 90 85" 
        fill="url(#blackGradient)" 
        opacity="0.9"/>
  
  <!-- Dot (Person Icon) -->
  <circle cx="95" cy="25" r="8" fill="url(#orangeGradient)">
    <animate attributeName="cy" values="25;23;25" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Gradients -->
  <defs>
    <linearGradient id="orangeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f49364;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f06a22;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d85f1f;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="blackGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#404040;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#262626;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1c1917;stop-opacity:1" />
    </linearGradient>
    
    <!-- Shadow Filter -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
</svg>
